<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Rumble Toolkit</title>
    <script src="js/common.js?v=1.1.0"></script>
    <script src="js/popup.js?v=1.1.0"></script>
    <link rel="stylesheet" href="css/style.css?v=1.1.0">
</head>

<body>
    <header class="app-header">
        <img src="icons/rumble-32.png" alt="" class="app-icon">
        <h1 id="app-title" class="app-title"></h1>
    </header>

    <main class="app-body">
        <div class="field playback-feature">
            <div class="field-header speed-feature-header">
                <span class="speed-feature-title">
                    <svg class="speed-feature-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path d="M9 1 3 9h4l-1 6 6-8H8l1-6Z"></path>
                    </svg>
                    <label id="label-playback-feature"></label>
                </span>
                <label class="toggle toggle-lg">
                    <input type="checkbox" id="rumble_playback_enabled">
                    <span class="toggle-track"></span>
                </label>
            </div>

            <label id="label-speed" for="rumble_speed" class="field-sublabel"></label>
            <div class="speed-control playback-control">
                <input type="range" id="rumble_speed" min="0" max="10" step="0.25">
                <div class="speed-value-box">
                    <input type="number" id="rumble_speed_value" min="0" max="10" step="0.25">
                    <span class="speed-unit">x</span>
                </div>
            </div>

            <label id="label-volume" for="rumble_volume" class="field-sublabel with-gap"></label>
            <div class="speed-control playback-control">
                <input type="range" id="rumble_volume" min="0" max="300" step="5">
                <div class="speed-value-box">
                    <input type="number" id="rumble_volume_value" min="0" max="300" step="5">
                    <span class="speed-unit">%</span>
                </div>
            </div>
        </div>

        <div class="field">
            <label id="label-resolution" for="rumble_resolution"></label>
            <div class="select-wrap">
                <select id="rumble_resolution"></select>
            </div>
        </div>

        <div class="field">
            <label id="label-player-mode" for="rumble_player_mode"></label>
            <div class="select-wrap">
                <select id="rumble_player_mode"></select>
            </div>
        </div>

        <button id="btsend" type="button" class="save-button"></button>

        <div id="saved-message" class="saved-message" role="status"></div>
    </main>

    <footer class="app-footer">
        <p id="footer-heart" class="footer-heart"></p>
        <p id="footer-support-label" class="footer-support-label"></p>

        <button type="button" id="btc-copy" class="btc-copy">
            <code id="btc-address">bc1qmzde7n8xm45c03wjsf4nwjsx4p67ynugem9dr4</code>
            <svg class="btc-copy-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5.5" y="5.5" width="8" height="8" rx="1.5"></rect>
                <path d="M3.5 10.5H2.75A1.25 1.25 0 0 1 1.5 9.25v-6A1.25 1.25 0 0 1 2.75 2h6A1.25 1.25 0 0 1 10 3.25V4"></path>
            </svg>
        </button>
        <p id="btc-copied" class="btc-copied"></p>

        <div class="footer-divider"></div>

        <p id="footer-follow-label" class="footer-follow-label"></p>
        <div class="footer-links">
            <a href="https://x.com/wiskton" target="_blank" rel="noopener noreferrer">X</a>
            <a href="https://twitch.tv/wiskton" target="_blank" rel="noopener noreferrer">Twitch</a>
            <a href="https://kick.com/wiskton" target="_blank" rel="noopener noreferrer">Kick</a>
        </div>

        <p class="footer-credit"><span id="footer-credit-label"></span> <strong>wiskton</strong></p>
    </footer>
</body>

</html>
